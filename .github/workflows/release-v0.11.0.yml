name: Publish v0.11.0 world assets

on:
  push:
    branches: [main]
    paths: [.github/workflows/release-v0.11.0.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-v0.11.0
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'Xenoah/vrcworld_tech-tech-cafe' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out release source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          # validate_cafe_experience.py compares against the v0.8.0 commit (65c185a).
          fetch-depth: 0

      - name: Verify source and build distribution archives
        run: |
          python -c 'import json; assert json.load(open("Unity/Assets/TheCommons/Data/world_manifest.json"))["version"] == "0.11.0"'
          python -c 'import json; r=json.load(open("Documentation/experience_validation.json")); assert all(r["checks"].values()), r["checks"]'
          python -c 'import json; r=json.load(open("Documentation/kart_neon_validation.json")); assert all(r["checks"].values()) and not r["issues"], r'
          sha256sum --check SHA256SUMS.txt --quiet
          python Blender/validate_cafe_experience.py
          python Blender/package_release.py
          git diff --exit-code
          python Blender/verify_release.py

      - name: Publish verified release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Refuse to reuse or replace an existing tag or release.
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v0.11.0" --jq 'map(select(.ref == "refs/tags/v0.11.0")) | length')" -eq 0
          gh release create v0.11.0 \
            ../The_Commons_Compact_v0.11.0.unitypackage \
            ../The_Commons_Compact_v0.11.0_Full.zip \
            ../SHA256SUMS-v0.11.0.txt \
            ../release-validation-v0.11.0.json \
            Preview/41_Cafe_Particle_Lasers.png \
            Preview/42_Kart_Neon_Pass.png \
            Preview/43_Kart_Torii_Tunnel.png \
            Preview/44_Kart_Pass_Gate.png \
            Preview/45_Kart_Neon_Overview.png \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "v0.11.0 — BGM同期のパーティクルレーザー・カートのネオトーキョー装飾" \
            --notes-file Documentation/RELEASE_v0.11.0.md \
            --latest
