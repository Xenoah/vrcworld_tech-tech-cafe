name: Publish v0.6.0 world assets

on:
  push:
    branches: [main]
    paths: [.github/workflows/release-v0.6.0.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-v0.6.0
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'Xenoah/vrcworld_tech-tech-cafe' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out release source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Verify source and build distribution archives
        run: |
          python -c 'import json; assert json.load(open("Unity/Assets/TheCommons/Data/world_manifest.json"))["version"] == "0.6.0"'
          sha256sum --check SHA256SUMS.txt --quiet
          python Blender/package_release.py
          git diff --exit-code
          python Blender/verify_release.py

      - name: Publish verified release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Refuse to reuse or replace an existing tag or release.
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v0.6.0" --jq 'map(select(.ref == "refs/tags/v0.6.0")) | length')" -eq 0
          gh release create v0.6.0 \
            ../The_Commons_Compact_v0.6.0.unitypackage \
            ../The_Commons_Compact_v0.6.0_Full.zip \
            ../SHA256SUMS-v0.6.0.txt \
            ../release-validation-v0.6.0.json \
            Preview/16_Kart_Overview.png \
            Preview/17_Kart_Overpass.png \
            Preview/18_Kart_Driver.png \
            Preview/19_Kart_Pits.png \
            Preview/20_Kart_UpperTechnical.png \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "v0.6.0 — NEON SWITCHYARD 屋内テクニカルコース" \
            --notes-file Documentation/RELEASE_v0.6.0.md \
            --latest
